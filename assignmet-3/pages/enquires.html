<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استفسارات</title>
</head>
<body>
    <nav>
        <a href="../index.html">العودة إلى الصفحة الرئيسية</a>
        <br> <a href="../contact.html">تواصل معنا</a>
        <br>  <a href="../courses.html">الدورات</a>
    </nav>

<form >
    
    <h1>استفسر عن الكورس</h1>
    <label for="full-name">الاسم كامل:</label>
    <input type="text" name="full-name"  id="full-name" placeholder="الاسم كامل" autocomplete="name" >
    <button type="submit">إرسال</button>
<br>
    <label for="email">البريد الإلكتروني:</label>
    <input type="email" name="email" id="email" placeholder="البريد الإلكتروني" autocomplete="email">
     <button type="submit">إرسال</button>
<br>
    <label for="phone">رقم الهاتف:</label>
    <input type="tel" name="phone" id="phone" placeholder="رقم الهاتف" autocomplete="tel">
     <button type="submit">إرسال</button>
    <br>
    <label for="course_selection">اختر كورس:</label>
    <select name="course_selection" id="course_selection">
        <option value="forms"> HTML Forms</option>
        <option value="content"> HTML Content</option>
    </select>
     <button type="submit">إرسال</button>
<br>
<label for="number_of_people">عدد الأشخاص:</label>
<input type="number" min="1" max="10" value="1" name="number_of_people" id="number_of_people" placeholder="عدد الأشخاص">
 <button type="submit">إرسال</button>
<br>
<label for="date">اختر التاريخ والوقت:</label>
<input type="date" id="date" name="date" >
 <button type="submit">إرسال</button>
<br>
    <label for="message">رسالتك:</label>
    <textarea name="message" id="message" rows="4" placeholder="اكتب رسالتك هنا"></textarea>
     <button type="submit">إرسال</button>



















</form>






























</body>

</html>
